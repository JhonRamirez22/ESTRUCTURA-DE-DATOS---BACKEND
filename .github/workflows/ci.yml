name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Instalar dependencias
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Tipos
        run: uv run mypy app
      - name: Pruebas
        run: uv run pytest -q
